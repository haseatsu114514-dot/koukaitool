name: Verify and deploy Stella File
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /koukaitool
      NEXT_PUBLIC_SITE_URL: https://haseatsu114514-dot.github.io
      # Settings → Secrets and variables → Actions → Variables → LINE_FRIEND_URL. Unset hides the LINE button.
      NEXT_PUBLIC_LINE_URL: ${{ vars.LINE_FRIEND_URL }}
      # Optional: JSON of type slug → friend-add URL (e.g. one Lステップ/エルメ source URL per type).
      NEXT_PUBLIC_LINE_URLS: ${{ vars.LINE_FRIEND_URLS }}
      # Optional: GA4 measurement ID (G-...). Unset means no analytics.
      NEXT_PUBLIC_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
